[project]
name = "bwin-apis"
version = "0.1.0"
description = "CMS + LMS platform backend for BWIN Consultants."
requires-python = ">=3.11"

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Project convention: application errors are named `*Exception`, not `*Error`.
"app/core/exceptions.py" = ["N818"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
# The project root contains an `alembic/` directory, which would otherwise
# make isort classify the installed `alembic` package as first-party.
known-third-party = ["alembic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# One event loop for the whole session: the engine's connection pool caches
# connections bound to the loop that opened them, so a per-test loop hands
# back connections tied to an already-closed loop.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
